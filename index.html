<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TV Launcher sign-in</title>
<style>
  body { font-family: system-ui, sans-serif; background: #10141c; color: #e8ecf3; margin: 0; padding: 32px 20px; line-height: 1.5; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #b6bfcd; }
  a.button { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #4c7dff; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Sending to your TV…</h1>
  <p id="text">Keep your phone on the same Wi-Fi as the TV.</p>
  <a id="link" class="button" hidden>Send to the TV</a>
</main>
<script>
  // Google sends the phone here after sign-in. The TV said where it listens (its address on
  // your home Wi-Fi) in "state"; this page only passes the code along to it. Nothing is stored.
  (function () {
    var q = new URLSearchParams(location.search);
    var title = document.getElementById('title');
    var text = document.getElementById('text');
    var state = q.get('state') || '';
    var m = /^(\d{1,3}(?:\.\d{1,3}){3})-(\d{2,5})-([A-Za-z0-9_-]{8,64})$/.exec(state);
    var privateIp = m && /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(m[1]);
    if (q.get('error')) {
      title.textContent = 'Sign-in was cancelled';
      text.textContent = 'You can close this page and try again from the TV.';
      return;
    }
    if (!q.get('code') || !privateIp) {
      title.textContent = 'Nothing to send';
      text.textContent = 'Open this page by scanning the QR code on the TV.';
      return;
    }
    var target = 'http://' + m[1] + ':' + m[2] + '/google?code=' + encodeURIComponent(q.get('code')) +
      '&state=' + encodeURIComponent(state);
    history.replaceState(null, '', location.pathname);
    var link = document.getElementById('link');
    link.href = target;
    link.hidden = false;
    location.replace(target);
  })();
</script>
</body>
</html>
